<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title        { font-size: 22px; font-weight: 700; fill: #e6e6e6; font-family: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace; }
      .subtitle     { font-size: 14px; fill: #8b8b8b; font-family: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace; }
      .panel-header { font-size: 15px; font-weight: 700; font-family: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace; }
      .label        { font-size: 10px; fill: #707070; letter-spacing: 1.2px; font-family: ui-monospace, monospace; font-weight: 600; }
      .label-sub    { font-size: 10px; fill: #5dade2; letter-spacing: 0.6px; font-family: ui-monospace, monospace; font-weight: 600; }
      .bubble-user  { font-size: 14px; fill: #ffffff; }
      .bubble-bot   { font-size: 14px; fill: #e0e0e0; }
      .bubble-bot-soft { font-size: 14px; fill: #b4b4b4; }
      .leak-text    { font-size: 14px; fill: #ffb4b0; font-weight: 700; }
      .gated-text   { font-size: 14px; fill: #c8e6c8; font-weight: 600; }
      .callout-head { font-size: 11px; fill: #707070; letter-spacing: 1.2px; font-family: ui-monospace, monospace; font-weight: 600; }
      .callout-body { font-size: 13px; fill: #d4d4d4; font-family: ui-monospace, monospace; }
      .audit-block  { font-size: 11px; fill: #ff8a80; font-weight: 700; letter-spacing: 0.5px; font-family: ui-monospace, monospace; }
      .audit-allow  { font-size: 11px; fill: #69db7c; font-weight: 700; letter-spacing: 0.5px; font-family: ui-monospace, monospace; }
      .audit-key    { font-size: 12px; fill: #c4c4c4; font-family: ui-monospace, monospace; }
      .audit-reason { font-size: 11px; fill: #707070; font-family: ui-monospace, monospace; }
      .footer-big   { font-size: 18px; font-weight: 700; fill: #e6e6e6; font-family: ui-monospace, monospace; }
      .ok           { fill: #69db7c; }
      .bad          { fill: #ff8a80; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="820" fill="#161616"/>

  <!-- Title -->
  <text x="700" y="44" text-anchor="middle" class="title">Argo &#8212; same conversation, with vs without the gate</text>
  <text x="700" y="70" text-anchor="middle" class="subtitle">Rahul asks whether his own transfer cleared. The counterparty&#8217;s account number is on that row.</text>

  <!-- ============================================================== -->
  <!-- LEFT PANEL — Without Argo                                      -->
  <!-- ============================================================== -->
  <rect x="40" y="100" width="650" height="620" rx="10" fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="62" cy="124" r="6" fill="#ff5f56"/>
  <circle cx="82" cy="124" r="6" fill="#ffbd2e"/>
  <circle cx="102" cy="124" r="6" fill="#27c93f"/>
  <text x="670" y="129" text-anchor="end" class="bad panel-header">&#10007;  Without Argo</text>
  <line x1="56" y1="148" x2="674" y2="148" stroke="#1f1f1f" stroke-width="1"/>

  <!-- User bubble (Rahul) — right aligned -->
  <text x="670" y="178" text-anchor="end" class="label">RAHUL</text>
  <rect x="290" y="188" width="380" height="74" rx="14" fill="#1d4ed8"/>
  <text x="304" y="214" class="bubble-user">Did my $200 transfer to John go</text>
  <text x="304" y="236" class="bubble-user">through this morning?</text>

  <!-- Assistant bubble (leaky) — left aligned -->
  <text x="60" y="292" class="label">BANK ASSISTANT</text>
  <rect x="60" y="302" width="400" height="98" rx="14" fill="#262a33"/>
  <text x="74" y="328" class="bubble-bot">Yes &#8212; your $200 transfer to John went</text>
  <text x="74" y="350" class="bubble-bot">through this morning. It landed in his</text>
  <rect x="70" y="358" width="250" height="22" rx="3" fill="#3a1a1a"/>
  <text x="74" y="374" class="leak-text">account &#8226;&#8226;&#8226;&#8226;7782 at First National.</text>

  <!-- Divider -->
  <line x1="56" y1="428" x2="674" y2="428" stroke="#1f1f1f" stroke-width="1"/>

  <!-- Callout -->
  <text x="60" y="454" class="callout-head">WHAT JUST LEAKED</text>

  <circle cx="68" cy="486" r="4" class="bad"/>
  <text x="82" y="490" class="callout-body">John&#8217;s account number &#8212; counterparty PII sitting on</text>
  <text x="82" y="510" class="callout-body" fill="#707070">Rahul&#8217;s own transfer row, which he&#8217;s allowed to fetch.</text>

  <circle cx="68" cy="544" r="4" class="bad"/>
  <text x="82" y="548" class="callout-body">No IAM check fires &#8212; the row was returned correctly;</text>
  <text x="82" y="568" class="callout-body" fill="#707070">the LLM chose, at synthesis time, to read it aloud.</text>

  <text x="60" y="638" class="callout-body" fill="#707070" font-size="12">OWASP LLM Top 10 &#8470;2 &#8212; Sensitive Information Disclosure.</text>
  <text x="60" y="658" class="callout-body" fill="#707070" font-size="12">Your compliance reviewer&#8217;s veto, in one screenshot.</text>

  <!-- ============================================================== -->
  <!-- RIGHT PANEL — With Argo                                        -->
  <!-- ============================================================== -->
  <rect x="710" y="100" width="650" height="620" rx="10" fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="732" cy="124" r="6" fill="#ff5f56"/>
  <circle cx="752" cy="124" r="6" fill="#ffbd2e"/>
  <circle cx="772" cy="124" r="6" fill="#27c93f"/>
  <text x="1340" y="129" text-anchor="end" class="ok panel-header">&#10003;  With Argo</text>
  <line x1="726" y1="148" x2="1344" y2="148" stroke="#1f1f1f" stroke-width="1"/>

  <!-- User bubble (Rahul) — same prompt -->
  <text x="1340" y="178" text-anchor="end" class="label">RAHUL</text>
  <rect x="960" y="188" width="380" height="74" rx="14" fill="#1d4ed8"/>
  <text x="974" y="214" class="bubble-user">Did my $200 transfer to John go</text>
  <text x="974" y="236" class="bubble-user">through this morning?</text>

  <!-- Assistant bubble (gated) — left aligned -->
  <text x="730" y="292" class="label">BANK ASSISTANT  <tspan class="label-sub">&#8226; gated by Argo</tspan></text>
  <rect x="730" y="302" width="400" height="98" rx="14" fill="#262a33"/>
  <text x="744" y="328" class="bubble-bot-soft">Yes &#8212; your $200 transfer to John went</text>
  <text x="744" y="350" class="bubble-bot-soft">through this morning. I can&#8217;t share his</text>
  <text x="744" y="372" class="gated-text">account details, but your payment is confirmed.</text>

  <!-- Divider -->
  <line x1="726" y1="428" x2="1344" y2="428" stroke="#1f1f1f" stroke-width="1"/>

  <!-- Audit -->
  <text x="730" y="454" class="callout-head">AUDIT &#8226; per-claim verdicts, persisted to audit_events</text>

  <g transform="translate(730, 478)">
    <!-- row 1 -->
    <rect x="0" y="0" width="56" height="22" rx="3" fill="#3a1a1a"/>
    <text x="28" y="15" text-anchor="middle" class="audit-block">BLOCK</text>
    <text x="68" y="15" class="audit-key">counterparty.account_number</text>
    <text x="320" y="15" class="audit-reason">field not in whitelist</text>

    <!-- row 2 -->
    <rect x="0" y="34" width="56" height="22" rx="3" fill="#1a3a22"/>
    <text x="28" y="49" text-anchor="middle" class="audit-allow">ALLOW</text>
    <text x="68" y="49" class="audit-key">own.transaction.status</text>
    <text x="320" y="49" class="audit-reason">Rahul owns the source row</text>

    <!-- row 3 -->
    <rect x="0" y="68" width="56" height="22" rx="3" fill="#1a3a22"/>
    <text x="28" y="83" text-anchor="middle" class="audit-allow">ALLOW</text>
    <text x="68" y="83" class="audit-key">own.transaction.amount</text>
    <text x="320" y="83" class="audit-reason">Rahul owns the source row</text>

    <!-- row 4 -->
    <rect x="0" y="102" width="56" height="22" rx="3" fill="#1a3a22"/>
    <text x="28" y="117" text-anchor="middle" class="audit-allow">ALLOW</text>
    <text x="68" y="117" class="audit-key">own.transaction.recipient</text>
    <text x="320" y="117" class="audit-reason">Rahul owns the source row</text>
  </g>

  <text x="730" y="638" class="callout-body" fill="#707070" font-size="12">Whitelist policy: counterparty_fields = &#123;transaction, account_ownership, aggregate&#125;.</text>
  <text x="730" y="658" class="callout-body" fill="#707070" font-size="12">counterparty.account_number isn&#8217;t in the set &#8212; blocked, regardless of what the LLM tried to say.</text>

  <!-- ============================================================== -->
  <!-- Footer                                                          -->
  <!-- ============================================================== -->
  <text x="700" y="770" text-anchor="middle" class="footer-big">Same prompt. Same LLM. Argo gates output and audits every claim.</text>
</svg>
