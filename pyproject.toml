[project]
name = "argo"
version = "0.0.1"
description = "Identity-aware runtime gate for LLM responses"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Argo contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "litellm>=1.50",
    "anthropic>=0.39",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Long lines are inherent to these files, not a style lapse:
#   seed.py  — fixed-width demo data tables; wrapping them destroys the grid
#   judge.py / verifier.py — verbatim few-shot prompt text, where a line break
#     would change what the model is actually sent
"argo/db/seed.py" = ["E501"]
"argo/judge.py" = ["E501"]
"argo/verifier.py" = ["E501"]
"argo/naive.py" = ["E501"]
# Eval harnesses: aligned expectation tables and wide report lines, where
# wrapping costs more readability than it buys.
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "db: requires a live Postgres (set TEST_DATABASE_URL); skipped otherwise",
]
