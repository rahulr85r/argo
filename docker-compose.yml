services:
  postgres:
    image: postgres:16
    container_name: argo-postgres
    environment:
      POSTGRES_DB: argo
      POSTGRES_USER: argo
      POSTGRES_PASSWORD: argo
    ports:
      - "5432:5432"
    volumes:
      - argo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argo -d argo"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build: .
    container_name: argo-gateway
    ports:
      - "8000:8000"
    environment:
      # Postgres connection — talks to the sibling service by name.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: argo
      POSTGRES_USER: argo
      POSTGRES_PASSWORD: argo
      # Pin the counterparty-rule clock to the bundled dataset so the demo's
      # fixed Feb–May 2026 transactions never age out of the 90-day window.
      # Real deployments leave this empty — see .env.example.
      REFERENCE_TIME: ${REFERENCE_TIME:-seed}
      # Models (overridable via .env).
      CHAT_MODEL: ${CHAT_MODEL:-anthropic/claude-haiku-4-5}
      JUDGE_MODEL: ${JUDGE_MODEL:-anthropic/claude-haiku-4-5}
      # Anthropic key MUST be set in .env (or the host shell). Compose
      # passes the value through; the image never contains it.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\", timeout=2)'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  argo_pg:
