services:
  postgres:
    image: postgres:16
    container_name: argo-postgres
    environment:
      POSTGRES_DB: argo
      POSTGRES_USER: argo
      POSTGRES_PASSWORD: argo
    ports:
      - "5432:5432"
    volumes:
      - argo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argo -d argo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  argo_pg:
